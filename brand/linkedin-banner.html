<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #0A0B0D; }
  .b {
    position: relative; width: 1584px; height: 396px; overflow: hidden; color: #F1EFEA; font-family: Geist, sans-serif;
    background:
      radial-gradient(520px 300px at 1330px 130px, rgba(255, 110, 50, .16), transparent 70%),
      radial-gradient(700px 380px at 0 0, rgba(255, 90, 31, .07), transparent 70%),
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px) 0 0 / 44px 44px,
      #0A0B0D;
  }
  svg { position: absolute; inset: 0; }
  .txt { position: absolute; left: 500px; top: 56px; width: 600px; }
  .kick { font-family: 'Geist Mono', monospace; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #FF7C4A; display: flex; align-items: center; gap: 10px; }
  .kick i { width: 8px; height: 8px; border-radius: 50%; background: #2BD4A0; box-shadow: 0 0 0 4px rgba(43,212,160,.15); }
  h1 { margin-top: 18px; font-size: 54px; line-height: 1.02; letter-spacing: -.045em; font-weight: 600; }
  h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -.01em; color: #FF5A1F; }
  .sub { margin-top: 16px; font-size: 18px; color: #C9CBCF; letter-spacing: -.005em; }
  .sub b { color: #F1EFEA; font-weight: 600; }
  .chips { margin-top: 20px; display: flex; gap: 8px; flex-wrap: nowrap; }
  .chips span { font-family: 'Geist Mono', monospace; font-size: 12.5px; color: #C9CBCF; padding: 5px 11px; border: 1px solid #34343A; border-radius: 999px; background: rgba(20,21,24,.7); white-space: nowrap; }
  .chips span.hot { border-color: rgba(255,90,31,.55); color: #FFB08F; }
  .url { display: inline-block; margin-top: 18px; font-family: 'Geist Mono', monospace; font-size: 15px; color: #F1EFEA; background: rgba(10,11,13,.75); padding: 6px 12px; border-radius: 8px; border: 1px solid #2C3138; }
  .url span { color: #FF7C4A; }
  .hud { position: absolute; top: 22px; right: 44px; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: .08em; color: rgba(235,240,245,.8); background: rgba(8,10,12,.6); border: 1px solid #22262C; padding: 5px 10px; border-radius: 6px; display: flex; gap: 8px; align-items: center; }
  .hud i { width: 7px; height: 7px; border-radius: 50%; background: #FF4D4D; }
  .lbl { font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; }
</style></head>

  <div class="hud"><i></i> VIDES EDGE NODE · 14 DETECTORS · &lt;40 MS</div>
